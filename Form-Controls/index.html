<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>T-SHIRT ORDER </title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- customer name --> 
         <
         <p>
          <label for="name">Customer Name</label>
          <input type="text" name="name" id="name" minlength="2" maxlength="100" required />
         </p> 
        <!-- customer email -->
        <div>
          <label for="email">Customer Email</label>
          <input type="email"  name="email" id="email" required />
        </div>
        
         <p>colour</p>
         <div>
          <label for="colour">t-shirt colour:</label>
          <select id="colour">
            <option value="">Select a colour</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="blue">Blue</option>
          </select>
        </div>
        
        <p>sizes</p>
        <!-- T-shirt size selection  (6 options:XS, S, M, L, XL, XXL)-->
        <div>
          <label for="size">T-shirt Size:</label>
          <select id="size" name="size">
            <option value="">Select a size</option>
            <option value="xs">XS</option>
            <option value="s">S</option>
            <option value="m">M</option>
            <option value="l">L</option>
            <option value="xl">XL</option>
            <option value="xxl">XXL</option>
          </select>
        </div>
        <!-- SUBMIT button -->
         <P><div>
          <button type="submit">Submit Order</button>
        </div></P>
        </div>
      </form>
    </main>
    <footer>
      <p>Copyright 2026 T-SHIRT ORDER</p>
    </footer>
  </body>
</html>
